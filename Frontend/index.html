<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Japanese Character Recognition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="bg-decor"></div>

    <div class="container">

        <header class="header">
            <span class="badge">AI &middot; Computer Vision</span>
            <h1>Smart Japanese <span class="accent">Character</span> Recognition</h1>
            <p class="subtitle">Dessine un caractère Hiragana / Katakana et laisse le modèle deviner</p>
        </header>

        <main class="card">

            <div class="canvas-wrapper">
                <canvas id="canvas" width="280" height="280"></canvas>
                <div class="canvas-hint" id="canvasHint">Dessine ici ✍️</div>
            </div>

            <div class="controls">
                <button id="predictBtn" class="btn btn-primary">
                    <span class="btn-icon">✨</span>
                    <span>Predict</span>
                </button>
                <button id="clearBtn" class="btn btn-secondary">
                    <span class="btn-icon">🗑️</span>
                    <span>Clear</span>
                </button>
            </div>

            <div class="results">
                <div class="result-box">
                    <span class="result-label">Prediction</span>
                    <p id="prediction" class="result-value result-char">-</p>
                </div>
                <div class="result-box">
                    <span class="result-label">Confidence</span>
                    <p id="confidence" class="result-value">-</p>
                    <div class="confidence-bar">
                        <div id="confidenceFill" class="confidence-fill"></div>
                    </div>
                </div>
            </div>

        </main>

        <footer class="footer">
            <p>Modèle KNN &middot; Features HOG &middot; Dataset KMNIST</p>
        </footer>

    </div>

    <script src="script.js"></script>
</body>

</html>
